name: Desktop artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            builderArgument: --linux
            steamArguments: --linux --x64
            steamPlatform: linux-x64
            steamDirectory: linux-unpacked
            steamBinary: 2D-and-D
          - name: macOS
            runner: macos-latest
            builderArgument: --mac
            steamArguments: --mac --universal
            steamPlatform: macos-universal
            steamDirectory: mac-universal
            steamBinary: 2D-and-D.app/Contents/MacOS/2D-and-D
          - name: Windows
            runner: windows-latest
            builderArgument: --win
            steamArguments: --win --x64
            steamPlatform: windows-x64
            steamDirectory: win-unpacked
            steamBinary: 2D-and-D.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit
      - run: npm run generate:desktop-icons
      - run: npm run build:desktop

      - name: Install Chromium for browser-to-desktop save parity
        run: npx playwright install chromium

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Run Electron smoke test
        if: runner.os != 'Linux'
        run: npm run test:desktop:built

      - name: Run Electron smoke test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop:built

      - name: Build unsigned desktop artifacts
        run: npm run package:desktop:ci -- ${{ matrix.builderArgument }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build unpacked Steam runtime
        run: npm run package:steam:ci -- ${{ matrix.steamArguments }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Inspect and stage credential-free Steam depot preview
        run: >-
          npm run steam:prepare -- prepare
          --platform ${{ matrix.steamPlatform }}
          --input release/steam-build/${{ matrix.steamDirectory }}
          --output release/steam-preview/${{ matrix.steamPlatform }}

      - name: Smoke-test the actual packaged Steam runtime
        if: runner.os != 'Linux'
        run: npm run test:desktop:built -- --output electron-test-results/packaged
        env:
          ELECTRON_TEST_EXECUTABLE: ${{ github.workspace }}/release/steam-build/${{ matrix.steamDirectory }}/${{ matrix.steamBinary }}

      - name: Smoke-test the actual packaged Steam runtime under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop:built -- --output electron-test-results/packaged
        env:
          ELECTRON_TEST_EXECUTABLE: ${{ github.workspace }}/release/steam-build/${{ matrix.steamDirectory }}/${{ matrix.steamBinary }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: electron-results-${{ matrix.name }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: electron-test-results/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-preview-${{ matrix.steamPlatform }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/steam-preview/${{ matrix.steamPlatform }}/*.tar.gz
            release/steam-preview/${{ matrix.steamPlatform }}/*.json
            release/steam-preview/${{ matrix.steamPlatform }}/scripts/*.vdf.in

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 2dnd-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz

  verify-depots:
    name: Verify complete Steam depot set
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: steam-preview-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/steam-previews
      - name: Assemble and verify native cross-platform archives
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/steam-assembled"
          for platform in linux-x64 windows-x64 macos-universal; do
            tar -xzf "$RUNNER_TEMP/steam-previews/$platform.tar.gz" -C "$RUNNER_TEMP/steam-assembled"
          done
          npm run steam:prepare -- verify --input "$RUNNER_TEMP/steam-assembled"
