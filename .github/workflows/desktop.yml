name: Desktop artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            builderArgument: --linux
            steamArguments: --linux --x64
            steamPlatform: linux-x64
            steamDirectory: linux-unpacked
            steamBinary: 2D-and-D
          - name: macOS
            runner: macos-latest
            builderArgument: --mac
            steamArguments: --mac --universal
            steamPlatform: macos-universal
            steamDirectory: mac-universal
            steamBinary: 2D&D.app/Contents/MacOS/2D-and-D
          - name: Windows
            runner: windows-latest
            builderArgument: --win
            steamArguments: --win --x64
            steamPlatform: windows-x64
            steamDirectory: win-unpacked
            steamBinary: 2D-and-D.exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit
      - run: npm run generate:desktop-icons
      - run: npm run build:desktop

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Run Electron smoke test
        if: runner.os != 'Linux'
        run: npm run test:desktop:built

      - name: Run Electron smoke test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop:built

      - name: Build unsigned desktop artifacts
        run: npm run package:desktop:ci -- ${{ matrix.builderArgument }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build unpacked Steam runtime
        run: npm run package:steam:ci -- ${{ matrix.steamArguments }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Inspect and stage credential-free Steam depot preview
        run: >-
          npm run steam:prepare -- prepare
          --platform ${{ matrix.steamPlatform }}
          --input release/steam-build/${{ matrix.steamDirectory }}
          --output release/steam-preview/${{ matrix.steamPlatform }}

      - name: Smoke-test the actual packaged Steam runtime
        if: runner.os != 'Linux'
        run: npm run test:desktop:built
        env:
          ELECTRON_TEST_EXECUTABLE: ${{ github.workspace }}/release/steam-build/${{ matrix.steamDirectory }}/${{ matrix.steamBinary }}

      - name: Smoke-test the actual packaged Steam runtime under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop:built
        env:
          ELECTRON_TEST_EXECUTABLE: ${{ github.workspace }}/release/steam-build/${{ matrix.steamDirectory }}/${{ matrix.steamBinary }}

      - uses: actions/upload-artifact@v4
        with:
          name: steam-preview-${{ matrix.steamPlatform }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/steam-preview/${{ matrix.steamPlatform }}/*.tar.gz
            release/steam-preview/${{ matrix.steamPlatform }}/*.json
            release/steam-preview/${{ matrix.steamPlatform }}/scripts/*.vdf.in

      - uses: actions/upload-artifact@v4
        with:
          name: 2dnd-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
